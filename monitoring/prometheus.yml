global:
  scrape_interval: 5s
  evaluation_interval: 5s

rule_files:
  - rules.yml

scrape_configs:
  - job_name: backend
    static_configs: [{targets: ["backend:8000"]}]
  - job_name: frontend
    static_configs: [{targets: ["frontend:9101"]}]
  - job_name: pipeline            # stage metrics pushed by the DVC stages
    honor_labels: true
    static_configs: [{targets: ["pushgateway:9091"]}]
  - job_name: node
    static_configs: [{targets: ["node-exporter:9100"]}]
  - job_name: prometheus
    static_configs: [{targets: ["localhost:9090"]}]
