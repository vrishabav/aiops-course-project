data:
  # 3 large S&P 500 stocks per sector (9 sectors) + real estate and materials
  tickers: [AAPL, MSFT, NVDA, JPM, BAC, GS, JNJ, UNH, PFE, AMZN, HD, MCD, PG, KO, WMT,
            XOM, CVX, COP, CAT, HON, UPS, GOOGL, META, VZ, NEE, DUK, SO, PLD, AMT, LIN]
  vix: ^VIX
  start: "2015-01-01"
  end: "2026-01-01"          # exclusive: data up to 2025-12-31
features:
  windows: [1, 5, 22]        # HAR terms: day, week, month
  horizon: 5
train:
  train_end: "2021-12-31"    # train 2015-2021 (includes the 2020 crash)
  val_end: "2022-12-31"      # validation 2022, test 2023-2025
  seed: 42
  ray_cpus: 8
  grid:
    learning_rate: [0.03, 0.1]
    max_leaf_nodes: [15, 31]
    min_samples_leaf: [50, 200]
    max_iter: [200, 400]
    l2_regularization: [0.0, 1.0]
evaluate:
  max_qlike_ratio: 1.0       # champion QLIKE / naive QLIKE on the test years
  max_rmse_ratio: 1.0
