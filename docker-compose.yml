x-health: &health
  interval: 5s
  timeout: 3s
  retries: 30

services:
  model-server:
    build: {context: ., target: model-server}
    volumes: ["./serving:/model:ro"]
    ports: ["5001:5001"]
    healthcheck:
      <<: *health
      test: ["CMD", "python", "-c", "import urllib.request as u; u.urlopen('http://localhost:5001/ping')"]

  backend:
    build: {context: ., target: backend}
    environment:
      MODEL_URL: http://model-server:5001/invocations
      DATA_DIR: /app/data
      MODEL_DIR: /app/serving
      REPORTS_DIR: /app/reports
    volumes: ["./data:/app/data:ro", "./serving:/app/serving:ro", "./reports:/app/reports:ro"]
    ports: ["8000:8000"]
    depends_on: {model-server: {condition: service_healthy}}
    healthcheck:
      <<: *health
      test: ["CMD", "python", "-c", "import urllib.request as u; u.urlopen('http://localhost:8000/health')"]

  frontend:
    build: {context: ., target: frontend}
    environment:
      BACKEND_URL: http://backend:8000
    ports: ["8501:8501"]
    depends_on: {backend: {condition: service_healthy}}

  prometheus:
    image: prom/prometheus:v3.15.0
    volumes: ["./monitoring/prometheus.yml:/etc/prometheus/prometheus.yml:ro",
              "./monitoring/rules.yml:/etc/prometheus/rules.yml:ro"]
    ports: ["9090:9090"]

  pushgateway:
    image: prom/pushgateway:v1.11.2
    ports: ["9091:9091"]

  node-exporter:
    image: prom/node-exporter:v1.12.1
    command: ["--path.rootfs=/host"]
    pid: host
    volumes: ["/:/host:ro,rslave"]

  grafana:
    image: grafana/grafana:12.2.0
    environment:
      GF_AUTH_ANONYMOUS_ENABLED: "true"
      GF_AUTH_ANONYMOUS_ORG_ROLE: Admin
      GF_AUTH_DISABLE_LOGIN_FORM: "true"
      GF_DASHBOARDS_MIN_REFRESH_INTERVAL: 1s
      GF_DASHBOARDS_DEFAULT_HOME_DASHBOARD_PATH: /var/lib/grafana/dashboards/dashboard.json
    volumes: ["./monitoring/datasource.yml:/etc/grafana/provisioning/datasources/datasource.yml:ro",
              "./monitoring/dashboards.yml:/etc/grafana/provisioning/dashboards/dashboards.yml:ro",
              "./monitoring/dashboard.json:/var/lib/grafana/dashboards/dashboard.json:ro"]
    ports: ["3000:3000"]
